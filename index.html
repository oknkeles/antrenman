<style>
:root{
  --ground:#E9ECF0; --surface:#FFFFFF; --surface-2:#F3F5F8; --line:#D3D9E1;
  --ink:#141922; --ink-2:#4E5967; --ink-3:#7C8797;
  --accent:#12518F; --accent-soft:#DCE7F4; --accent-ink:#0C3B69;
  --warn:#8A6300; --warn-fill:#E8B31F;
  --shadow:0 1px 2px rgba(20,25,34,.06),0 4px 14px rgba(20,25,34,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1318; --surface:#171C23; --surface-2:#1E242D; --line:#2A323C;
    --ink:#E7EBF1; --ink-2:#A3ADBB; --ink-3:#79838F;
    --accent:#4C9AE8; --accent-soft:#16283C; --accent-ink:#9CC8F5;
    --warn:#E8B31F; --warn-fill:#E8B31F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1318; --surface:#171C23; --surface-2:#1E242D; --line:#2A323C;
  --ink:#E7EBF1; --ink-2:#A3ADBB; --ink-3:#79838F;
  --accent:#4C9AE8; --accent-soft:#16283C; --accent-ink:#9CC8F5;
  --warn:#E8B31F; --warn-fill:#E8B31F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; padding-bottom:40px;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

header.top{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line)}
.brand{padding:14px 0 10px}
.brand h1{margin:0;font-size:19px;font-weight:800;font-variation-settings:"wdth" 118;letter-spacing:.01em;text-transform:uppercase}
.days{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daybtn{
  flex:1 0 auto;min-width:44px;padding:7px 9px 8px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;text-align:center;position:relative;transition:background .12s,color .12s,border-color .12s;
}
.daybtn small{display:block;font-size:9px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;margin-top:2px}
.daybtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.daybtn[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.daybtn.today::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--warn-fill)}
.daybtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dayhead{padding:18px 0 6px}
.dayhead .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dayhead h2{margin:2px 0 4px;font-size:34px;line-height:1.05;font-weight:800;font-variation-settings:"wdth" 112;letter-spacing:-.01em;text-wrap:balance}
.dayhead p{margin:0;color:var(--ink-2);font-size:14px}
.legend{margin:14px 0 0;padding:9px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;line-height:1.45}
.legend b{font-weight:600}

.blocks{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card.plainc{padding:14px 16px}
.plainc h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.plainc ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14.5px}
.plainc ul li{margin:3px 0}

.ex{display:flex;align-items:stretch}
.rail{flex:0 0 38px;background:var(--surface-2);border-right:1px solid var(--line);display:flex;justify-content:center;padding:13px 0}
.rail .n{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;color:var(--ink-3)}
.body{flex:1;min-width:0;padding:12px 14px 13px}
.exname{margin:0;font-size:17.5px;font-weight:700;line-height:1.25;font-variation-settings:"wdth" 104;text-wrap:balance}
.what{margin:8px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.chip.fail{background:transparent;border-color:var(--warn-fill);color:var(--warn)}
.chip.uni{background:transparent;border-color:var(--accent);color:var(--accent)}

.note{margin:9px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.note::before{content:"→ ";color:var(--ink-3)}

.links{display:flex;gap:14px;align-items:center;margin-top:11px;flex-wrap:wrap}
.vid{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.vid:hover{text-decoration:underline}
.vid:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
details.alt{font-size:12.5px}
details.alt summary{color:var(--ink-3);cursor:pointer;font-weight:600;list-style:none}
details.alt summary::-webkit-details-marker{display:none}
details.alt summary::before{content:"⇄ "}
details.alt p{margin:6px 0 0;color:var(--ink-2)}

.sslabel{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.ssitem{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.ssitem:first-child{margin-top:0}
.ssitem .tag{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:#fff;background:var(--accent);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;margin-top:2px}
.ssitem .t{font-size:16px;font-weight:700;line-height:1.3}

.restday{padding:26px 18px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);margin-top:18px}
.restday .big{font-size:26px;font-weight:800;font-variation-settings:"wdth" 110;margin:0 0 6px}
.restday p{margin:0;color:var(--ink-2);font-size:14.5px}

footer.fine{margin:22px 0 8px;font-size:12px;color:var(--ink-3);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:560px){.dayhead h2{font-size:40px}}
</style>

}

/* ============ EKRAN ============ */
let current = (new Date().getDay()+6)%7;

function renderDays(){
  const nav=$("#days"); nav.innerHTML="";
  const today=(new Date().getDay()+6)%7;
  P.forEach((d,i)=>{
    const b=el("button","daybtn");
    b.type="button"; b.setAttribute("aria-pressed", i===current);
    if(i===today) b.classList.add("today");
    b.innerHTML='<span>'+d.short+'</span><small>'+(d.rest?"OFF":d.name.split(" ")[0])+'</small>';
    b.onclick=()=>{ current=i; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(b);
  });
}

function exCard(b,idx){
  const card=el("div","card"), row=el("div","ex");
  const rail=el("div","rail"); rail.appendChild(el("div","n",String(idx))); row.appendChild(rail);
  const body=el("div","body");
  body.appendChild(el("h3","exname",b.en));
  if(b.plain) body.appendChild(el("p","what",b.plain));

  const chips=el("div","chips");
  const c1=el("span","chip"); c1.innerHTML='<b>'+b.sets+'</b> set × <b>'+reps(b)+'</b>'; chips.appendChild(c1);
  chips.appendChild(el("span","chip","ara "+sure(b.rest)));
  chips.appendChild(el("span","chip",yedek(b.rir)));
  if(b.uni) chips.appendChild(el("span","chip uni",b.uni+" başına"));
  if(b.fail) chips.appendChild(el("span","chip fail","son set tükeniş"));
  if(b.tempo) chips.appendChild(el("span","chip",b.tempo));
  body.appendChild(chips);
  if(b.note) body.appendChild(el("p","note",b.note));

  const links=el("div","links");
  links.appendChild(videoLink(b.en));
  if(b.alt&&b.alt.length){
    const dt=document.createElement("details"); dt.className="alt";
    const sm=document.createElement("summary"); sm.textContent="Makine doluysa";
    dt.appendChild(sm); dt.appendChild(el("p",null,b.alt.join(" · ")));
    links.appendChild(dt);
  }
  body.appendChild(links);
  row.appendChild(body); card.appendChild(row);
  return card;
}

function ssCard(b,idx){
  const card=el("div","card");
  card.appendChild(el("div","sslabel","Süperset · "+b.rounds+" tur · aralarında mola yok"));
  const row=el("div","ex");
  const rail=el("div","rail"); rail.appendChild(el("div","n",String(idx))); row.appendChild(rail);
  const body=el("div","body");
  b.items.forEach((it,i)=>{
    const w=el("div","ssitem");
    w.appendChild(el("span","tag",String.fromCharCode(65+i)));
    const box=el("div"); box.style.minWidth="0";
    box.appendChild(el("div","t",it.en+" × "+it.reps));
    if(it.plain) box.appendChild(el("p","what",it.plain));
    const lk=el("div","links"); lk.appendChild(videoLink(it.en)); box.appendChild(lk);
    w.appendChild(box);
    body.appendChild(w);
  });
  const chips=el("div","chips");
  chips.appendChild(el("span","chip","tur arası "+sure(b.rest)));
  chips.appendChild(el("span","chip",yedek(b.rir)));
  body.appendChild(chips);
  row.appendChild(body); card.appendChild(row);
  return card;
}


function render(){
  renderDays();
  const day=P[current], m=$("#main"); m.innerHTML="";

  const head=el("div","dayhead");
  head.appendChild(el("div","kicker",day.wd));
  head.appendChild(el("h2",null,day.name));
  head.appendChild(el("p",null,day.focus + (day.rest?"":" · "+totalSets(day)+" set")));
  m.appendChild(head);

  if(day.rest){
    const r=el("div","restday");
    r.appendChild(el("div","big",day.restTitle));
    r.appendChild(el("p",null,day.restText));
    m.appendChild(r);
  } else {
    const lg=el("div","legend");
    lg.innerHTML='<b>“2 tekrar yedekte”</b> = seti bıraktığında 2 tekrar daha yapabilecek durumda ol. Zorlanmadan değil, sonuna kadar gitmeden bırak.';
    m.appendChild(lg);

    const wrap=el("div","blocks"); let n=0;
    day.blocks.forEach(b=>{
      if(b.t==="warm"||b.t==="cool"){
        const c=el("div","card plainc");
        c.appendChild(el("h3",null,b.t==="warm"?"Isınma":"Soğuma"));
        const ul=document.createElement("ul");
        b.items.forEach(i=>ul.appendChild(el("li",null,i)));
        c.appendChild(ul); wrap.appendChild(c);
      } else if(b.t==="ex"){ wrap.appendChild(exCard(b,++n)); }
      else if(b.t==="ss"){ wrap.appendChild(ssCard(b,++n)); }
      else if(b.t==="fin"){
        const c=el("div","card plainc");
        c.appendChild(el("h3",null,"Bitiriş"));
        const t=el("div"); t.style.fontSize="17px"; t.style.fontWeight="700";
        t.textContent=b.en+" · "+(b.dur/60)+" dk"; c.appendChild(t);
        c.appendChild(el("p","note",b.note));
        wrap.appendChild(c);
      }
    });
    m.appendChild(wrap);
  }

  const f=el("footer","fine");
  f.textContent="“Form videosu” bağlantıları YouTube’da o hareketin aramasını açar; üstteki videolardan biri işini görür.";
  m.appendChild(f);
}

render();
</script>

</body>
</html>
